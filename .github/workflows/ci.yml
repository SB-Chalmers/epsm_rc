name: Development checks
'on':
  pull_request:
    branches:
    - dev
    - main
    # Prose-only changes cannot affect the solver, wheel or tests.
    paths-ignore:
    - '**.md'
    - 'docs/**'
    - 'LICENSE'
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - run: cargo fmt --all --check
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo test --locked
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    # Compile the release extension once and test the wheel that was built,
    # rather than compiling again for a source install.
    - name: Build wheel and install development prerequisites
      run: |
        python -m pip install build
        python -m build --wheel
        python -m pip install "$(ls dist/epsm_rc-*.whl)[dev,heatpump]"
    - name: Run offline development checks
      run: |
        python -m pytest -q tests/unit/test_iso13790.py tests/unit/test_iso13790_compliance.py tests/unit/test_iso13790_physics.py tests/unit/test_heating.py tests/unit/test_heat_pump.py tests/unit/test_standalone_readiness.py tests/unit/test_native_kernels.py
