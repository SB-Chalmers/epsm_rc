name: Development checks
'on':
  pull_request:
    branches:
    - dev
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
    - name: Install development prerequisites
      run: python -m pip install build '.[dev,heatpump]'
    - name: Run offline development checks
      run: |
        python -m pytest -q tests/unit/test_iso13790*.py tests/unit/test_heating.py tests/unit/test_heat_pump.py tests/unit/test_standalone_readiness.py
        python -m build --wheel
