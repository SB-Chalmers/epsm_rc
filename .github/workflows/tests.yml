name: RC release checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_data
          ssh-key: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
          persist-credentials: false
          ref: ae102d33eda79fd429fb445ec99b32dabcab8024
          path: .ci/epsm_data
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_core
          ssh-key: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
          persist-credentials: false
          ref: 8a7c5abf9228e7e6c3792f1f34490aaffd1f608f
          path: .ci/epsm_core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install platform dependencies and test tools
        run: python -m pip install build -e .ci/epsm_data -e .ci/epsm_core -e '.[platform,dev,gis]'
      - name: Run full RC suite
        run: python -m pytest -q
      - name: Build and check installed wheel
        run: |
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/epsm_rc-*.whl
          python -m pip check
          cd /tmp
          python -c 'from epsm_rc import RCSettings, simulate_building; print(RCSettings, simulate_building)'
