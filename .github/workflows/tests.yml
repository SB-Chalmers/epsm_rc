name: Release verification
env:
  CANDIDATE_REVISION: ${{ inputs.candidate_manifest_revision || '' }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  combination:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: Require an immutable candidate selection
      if: env.CANDIDATE_REVISION != ''
      run: |
        [[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Set EPSM_CANDIDATE_MANIFEST_SHA to the full checked EPSM SHA before adding platform-candidate'; exit 1; }
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_REVISION != '' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: SB-Chalmers/epsm
        ssh-key: ${{ secrets.EPSM_REPO_DEPLOY_KEY }}
        persist-credentials: false
        ref: ${{ env.CANDIDATE_REVISION || 'main' }}
        path: .ci/platform
        sparse-checkout: |
          /compatibility.json
          /compatibility-candidate.json
          /scripts/compatibility_matrix.py
        sparse-checkout-cone-mode: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - id: matrix
      env:
        MATRIX_MODE: ${{ inputs.development_dependencies && 'main' || 'pinned' }}
        PLATFORM_MANIFEST: ${{ env.CANDIDATE_REVISION != '' && '.ci/platform/compatibility-candidate.json' || '.ci/platform/compatibility.json' }}
      run: |
        echo "EPSM manifest: $(git -C .ci/platform rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
        candidate_args=()
        if [[ -n "$CANDIDATE_REVISION" ]]; then
          candidate_args=(--candidate-revision "$CANDIDATE_REVISION" --consumer-revision "$(git rev-parse HEAD)")
        fi
        python .ci/platform/scripts/compatibility_matrix.py \
          --manifest "$PLATFORM_MANIFEST" --consumer epsm_rc \
          --packages epsm_data epsm_core \
          --manifest-revision "$(git -C .ci/platform rev-parse HEAD)" \
          --mode "$MATRIX_MODE" "${candidate_args[@]}" >> "$GITHUB_OUTPUT"
  package:
    name: package (${{ matrix.python }})
    needs: combination
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.combination.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_REVISION != '' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: SB-Chalmers/epsm_data
        ssh-key: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
        persist-credentials: false
        ref: ${{ matrix.epsm_data }}
        path: .ci/epsm_data
    - uses: actions/checkout@v4
      with:
        repository: SB-Chalmers/epsm_core
        ssh-key: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
        persist-credentials: false
        ref: ${{ matrix.epsm_core }}
        path: .ci/epsm_core
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: pip
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    # Build the release sdist/wheel once and install that wheel with its extras;
    # a source install first would compile the native extension a second time.
    - name: Build release wheel and install coordinated dependencies
      run: |
        python -m pip install build setuptools wheel
        python -m build
        python -m pip install .ci/epsm_data '.ci/epsm_core[geometry]' "$(ls dist/epsm_rc-*.whl)[platform,dev,gis,notebook,docs,heatpump]"
        python -m pip check
        python -c "from epsm_rc.heating import HPLIB_AVAILABLE; assert HPLIB_AVAILABLE, 'Required hplib is unavailable'"
        mkdir -p outputs
        python -m pip freeze > outputs/environment.txt
        echo "EPSM compatibility manifest: ${{ matrix.manifest_revision }}"
        git rev-parse HEAD
        git -C .ci/epsm_core rev-parse HEAD
        git -C .ci/epsm_data rev-parse HEAD
    - name: Restore EnergyPlus 24.2
      id: energyplus-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/energyplus
        key: energyplus-24.2.0-e7ecb2d53b-Ubuntu22.04-x86_64
    - name: Install EnergyPlus 24.2
      if: steps.energyplus-cache.outputs.cache-hit != 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download v24.2.0 --repo NatLabRockies/EnergyPlus --pattern 'EnergyPlus-24.2.0-e7ecb2d53b-Linux-Ubuntu22.04-x86_64.tar.gz' --dir "$RUNNER_TEMP"
        mkdir -p "$RUNNER_TEMP/energyplus"
        tar -xzf "$RUNNER_TEMP/EnergyPlus-24.2.0-e7ecb2d53b-Linux-Ubuntu22.04-x86_64.tar.gz" -C "$RUNNER_TEMP/energyplus" --strip-components=1
    - name: Run full installed-wheel suite with required EnergyPlus and hplib
      env:
        EPSM_REQUIRE_ENERGYPLUS: '1'
        ENERGYPLUS_EXE: ${{ runner.temp }}/energyplus/energyplus
      run: |
        "$ENERGYPLUS_EXE" --version
        python -m pytest --junitxml=outputs/results.xml --basetemp=outputs/integration -q
        python - <<'PY'
        import xml.etree.ElementTree as ET
        root = ET.parse('outputs/results.xml').getroot()
        assert not root.findall('.//skipped'), 'Required platform and heat-pump checks must execute'
        PY
    - name: Check source style, documentation and offline examples
      if: matrix.python == '3.13'
      run: |
        python -m ruff check src tests benchmarks examples docs/conf.py
        python -m ruff format --check src tests benchmarks examples docs/conf.py
        python -m sphinx -W --keep-going -b html docs outputs/docs
        python -m sphinx -W --keep-going -b doctest docs outputs/doctest
        python examples/00_standalone.py
    - uses: actions/checkout@v4
      if: matrix.python == '3.13' && !inputs.development_dependencies
      with:
        repository: SB-Chalmers/epsm_core
        ssh-key: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
        persist-credentials: false
        ref: 3e0256d70c5e82849308b05544b1ad2fd0573665
        path: .ci/core_reference
    - uses: actions/checkout@v4
      if: matrix.python == '3.13' && !inputs.development_dependencies
      with:
        ref: 5a9d5f4251847e270b5dc4a526a4b2260915a4f9
        path: .ci/rc_reference
    - name: Compare released and candidate calculations within numerical tolerance
      if: matrix.python == '3.13' && !inputs.development_dependencies
      run: |
        python -m venv --system-site-packages .ci/reference_venv
        .ci/reference_venv/bin/python -m pip install --ignore-installed --no-deps --no-build-isolation .ci/core_reference .ci/rc_reference
        python benchmarks/run.py --directory outputs/legacy-regression --reference-python .ci/reference_venv/bin/python --repeats 2
        python benchmarks/run.py --directory outputs/prepared-regression --warm --reference-directory outputs/legacy-regression/reference --repeats 2
        python benchmarks/run.py --directory outputs/angular-regression --policy 2 --reference-python .ci/reference_venv/bin/python --repeats 2
        python benchmarks/run.py --directory outputs/angular-prepared-regression --policy 2 --warm --reference-directory outputs/angular-regression/reference --repeats 2
    - name: Execute installed-package notebooks in fresh kernels
      if: matrix.python == '3.13'
      run: |
        python - <<'PY'
        import nbformat
        from nbclient import NotebookClient
        for name in ('12_prepared_radiation', '13_shared_wall_boundaries', '14_roofs_and_basements'):
            book = nbformat.read(f'examples/{name}.ipynb', as_version=4)
            NotebookClient(book, timeout=120, kernel_name='python3').execute()
            nbformat.write(book, f'outputs/executed-{name}.ipynb')
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rc-package-${{ matrix.python }}
        path: |
          outputs/
          dist/
  standalone:
    if: ${{ !inputs.development_dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_REVISION != '' && (github.event.pull_request.head.sha || github.sha) || github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
    - uses: dtolnay/rust-toolchain@stable
    - name: Install base wheel without Core or Data
      run: |
        python -m pip install build pytest
        python -m build
        python -m pip install dist/epsm_rc-*.whl
        python -m pip check
        python -c "import importlib.util; assert importlib.util.find_spec('epsm_core') is None; assert importlib.util.find_spec('epsm_data') is None"
    - name: Execute supported Core-free numerical APIs
      run: |
        python examples/00_standalone.py
        python -m pytest tests/unit/test_iso13790.py tests/unit/test_iso13790_physics.py tests/unit/test_iso13790_compliance.py tests/unit/test_heat_pump.py tests/unit/test_heating.py tests/unit/test_public_readiness.py tests/unit/test_standalone_readiness.py tests/unit/test_native_kernels.py -q
'on':
  workflow_dispatch:
    inputs:
      development_dependencies:
        description: Check current Core/Data main branches on Python 3.13
        type: boolean
        default: false
      candidate_manifest_revision:
        description: Immutable EPSM SHA containing compatibility-candidate.json; empty uses supported pins
        type: string
        default: ''
