[package]
name = "epsm_rc"
version = "0.11.0"
edition = "2021"
license = "MIT"
description = "Rust core solver kernels for epsm_rc"

[lib]
name = "_core_rs"
path = "rust/src/lib.rs"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.27.2"
numpy = "0.27.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
