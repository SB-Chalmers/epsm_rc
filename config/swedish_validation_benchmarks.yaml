# =============================================================================
# Swedish Validation Benchmarks for SweLoadSim
# =============================================================================
# All benchmark values from authoritative Swedish sources for stochastic
# household electricity model validation.
#
# Sources:
#   - Sveby Brukarindata 2.0 (2024) - Swedish industry standard
#   - Enertech (2009) - Comprehensive Swedish appliance field study
#   - SCB TID2021 - Time Use Survey
#   - Huang & Ma (2024) - Swedish EV charging patterns
#   - SS 437 01 02 - Swedish standard for peak load estimation
# =============================================================================

# =============================================================================
# 1. AGGREGATE CONSUMPTION (Volume Validation)
# =============================================================================
aggregate_consumption:
  # Sveby 2.0 (2024) - Updated from previous 30 kWh/m²
  household_electricity:
    target_kwh_m2_year: 21.0
    acceptable_deviation: 3.0      # ±3 kWh/m² per Boverket
    note: "Reduced from 30 due to LED lighting and efficient appliances"
  
  domestic_hot_water:
    target_kwh_m2_year: 21.0
    old_buildings_kwh_m2_year: 25.0  # Non-efficient fixtures
  
  common_property:
    range_kwh_m2_year: [15.0, 20.0]
    elevators_kwh_year: 2000
    stairwell_lighting_kwh_year: 100
  
  # Annual consumption by household type (Enertech, excl heat/DHW)
  by_household_type:
    apartment:
      single_kwh_year: 1742
      couple_kwh_year: 2404
      family_kwh_year: 3710
      pensioner_kwh_year: 1910     # avg of 1682-2139
    house:
      single_kwh_year: 2500        # estimated (rare)
      couple_kwh_year: 3358
      family_kwh_year: 4143
      pensioner_kwh_year: 2918

# =============================================================================
# 2. TEMPORAL PATTERNS (Shape Validation)
# =============================================================================
temporal_patterns:
  # Monthly seasonality (Sveby curve)
  monthly_kwh_m2:
    january: 2.0      # Highest (weight ~9.5%)
    february: 1.85
    march: 1.75
    april: 1.60
    may: 1.50
    june: 1.40
    july: 1.30        # Lowest (weight ~6.2%)
    august: 1.35
    september: 1.55
    october: 1.70
    november: 1.85
    december: 1.95
    note: "Flatter than historical due to LED penetration"
  
  daily_peaks:
    morning:
      start_hour: 7
      end_hour: 9
    evening:
      start_hour: 17
      end_hour: 19
    cooking:
      start_hour: 17
      end_hour: 18
      note: "Often drives household maximum"
    lighting:
      correlates_with: "solar sunset"
      winter_increase: 0.30       # +30% vs annual average

# =============================================================================
# 3. LOAD DIVERSITY & COINCIDENCE (Grid Impact)
# =============================================================================
load_diversity:
  # Velander's Formula: P_max = k1*W + k2*sqrt(W)
  velander:
    k1: 0.00023                   # Apartments without electric heating
    k2: 0.063
    note: "Often overestimates for modern buildings"
  
  # Swedish Standard SS 437 01 02
  coincidence_ss_437:
    formula: "P_peak = 1.5*n + 12.5 kW"
    slope_kw_per_household: 1.5
    intercept_kw: 12.5
    applies_when: "N > 10"
  
  single_household:
    peak_to_avg_ratio:
      min: 1.7
      max: 3.1
  
  # Asymptotic behavior
  large_n:
    coincidence_factor_asymptote: 0.3    # ~30% at very large N

# =============================================================================
# 4. END-USE BREAKDOWN (Appliance Level)
# =============================================================================
end_use:
  # Standby power (Enertech)
  standby:
    apartment:
      min_watts: 34
      max_watts: 48
    house:
      min_watts: 59
      max_watts: 116
    components: ["routers", "TV standby", "clocks", "chargers"]
  
  # Cold appliances (Enertech)
  cold_appliances:
    apartment:
      avg_count: 1.33
      annual_kwh: 435
      note: "Mostly fridge/freezer combos"
    house:
      avg_count: 1.89
      annual_kwh: 585
      note: "Often separate fridge + freezer"
  
  # Heat gain contribution
  heat_gain:
    fraction: 0.70                # 70% of electricity becomes useful heat
    loss_fraction: 0.30           # Hot water drain, dryer venting, etc.

# =============================================================================
# 5. EV CHARGING (Huang & Ma 2024)
# =============================================================================
ev_charging:
  # Plug-in timing (residential)
  plugin_time:
    mean_hour: 17.1
    std_hour: 1.3
    min_hour: 15.0
    max_hour: 23.0
  
  # Connection duration (Long-Period Charging)
  connection:
    avg_duration_hours: 16.7
    location: "residential"
  
  # Daily charging demand
  demand:
    distribution: "lognormal"
    mode_kwh: 9.4
    median_kwh: 7.5
  
  # Coincidence factors by charger power
  coincidence:
    charger_3_7kw:
      factor: 0.65                # 60-70% at large N
      note: "Higher overlap, longer charging"
    charger_11kw:
      factor: 0.40                # ~40% at large N
      note: "Lower overlap, charging finishes faster"
  
  # Peak timing
  peak:
    residential_hour: 19.5        # 19:30, tail of cooking peak

# =============================================================================
# 6. DWELLING CHARACTERISTICS
# =============================================================================
dwelling:
  average_area:
    apartment_m2: 76
    house_m2: 127
  
  appliance_ownership:
    apartment:
      washing_machine_prob: 0.50    # Many use tvättstuga
      tumble_dryer_prob: 0.15
      dishwasher_prob: 0.50
    house:
      washing_machine_prob: 1.00
      tumble_dryer_prob: 0.60
      dishwasher_prob: 0.90

# =============================================================================
# 7. REPRESENTATIVE POPULATION DISTRIBUTION
# =============================================================================
population_distribution:
  # Primary split (Enertech)
  dwelling_type:
    apartment_fraction: 0.51
    house_fraction: 0.49
  
  # Household composition within apartments
  apartment_composition:
    single_26_64: 0.28
    couple_26_64: 0.30
    family_26_64: 0.28
    pensioner_65_plus: 0.14
  
  # Household composition within houses
  house_composition:
    family_26_64: 0.42
    couple_26_64: 0.36
    single_26_64: 0.04            # Rare
    pensioner_65_plus: 0.18

# =============================================================================
# 8. VALIDATION ACCEPTANCE CRITERIA
# =============================================================================
acceptance_criteria:
  # Volume validation
  annual_consumption:
    tolerance_percent: 30          # ±30% for stochastic models
  
  # Peak timing
  peak_timing:
    tolerance_hours: 1             # ±1 hour for peak identification
  
  # Coincidence factor
  coincidence:
    tolerance_percent: 20          # ±20% from formula
  
  # Standby power
  standby:
    tolerance_multiplier: 2.0      # Allow 0.5x to 2x range
  
  # Diversity decrease
  diversity:
    must_decrease_with_n: true
    minimum_cv_for_population: 0.20  # Coefficient of variation

# =============================================================================
# 9. QUICK REFERENCE: 100-Household Sample
# =============================================================================
reference_sample_100:
  apartments: 50
  houses: 50
  
  apartment_breakdown:
    singles: 14                    # Low load, late evening peaks
    couples: 15                    # Medium load
    families: 14                   # High load, morning/evening peaks
    pensioners: 7                  # High daytime load, high TV use
    with_in_unit_laundry: 25       # ~50% have own washer
  
  house_breakdown:
    families: 20                   # Highest load, high EV probability
    couples: 18                    # High load, high EV probability
    singles: 2                     # Rare
    pensioners: 10                 # Moderate load
    with_ev: 15                    # ~30% EV ownership (increasing)
