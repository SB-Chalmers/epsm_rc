[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm_rc"
version = "0.5.0"
description = "ISO 13790:2008 5R1C Building Thermal Model for Swedish Buildings"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Swedish Energy Institute"}
]
keywords = [
    "building-energy",
    "iso-13790",
    "5r1c",
    "thermal-model",
    "heating",
    "sweden",
    "tabula",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pvlib>=0.10.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
platform = ["epsm_core>=0.5.0", "epsm_data>=0.6.0"]
heatpump = [
    "hplib>=1.9",
]
gis = [
    "pyproj>=3.4.0",
    "requests>=2.28.0",
    "fiona>=1.9.0",
]
notebook = ["nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "matplotlib>=3.7.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["epsm_rc*"]

[tool.setuptools.package-data]
epsm_rc = ["data/epw/*.epw", "notices/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = ["energyplus: requires an installed EnergyPlus 24.2 executable and schema"]

[tool.ruff]
target-version = "py310"
line-length = 100
