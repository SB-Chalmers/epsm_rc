[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "epsm_rc"
dynamic = ["version"]
description = "Reduced-order building thermal simulation from explicit physical inputs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/epsm_rc/notices/*.txt"]
requires-python = ">=3.10"
authors = [
    {name = "EPSM Development contributors"}
]
keywords = [
    "building-energy",
    "iso-13790",
    "5r1c",
    "thermal-model",
    "heating",
    "sweden",
    "tabula",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pvlib>=0.10.0",
    "shapely>=2.0.0",
]

[project.urls]
Repository = "https://github.com/SB-Chalmers/epsm_rc"
Issues = "https://github.com/SB-Chalmers/epsm_rc/issues"

[project.optional-dependencies]
platform = ["epsm_core>=0.9.0,<0.10", "epsm_data>=0.7.0,<0.8"]
heatpump = [
    "hplib>=1.9",
]
gis = [
    "pyproj>=3.4.0",
    "requests>=2.28.0",
    "fiona>=1.9.0",
]
docs = ["sphinx>=7,<9"]
notebook = ["nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "matplotlib>=3.7.0",
    "ruff>=0.1.0",
]

[tool.maturin]
python-source = "src"
module-name = "epsm_rc._core_rs"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = ["energyplus: requires an installed EnergyPlus 24.2 executable and schema"]

[tool.ruff]
extend-exclude = ["docs/history"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
